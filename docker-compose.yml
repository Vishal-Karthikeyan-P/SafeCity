version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: safecity_db
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safecity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safecity_pass}
      POSTGRES_DB: ${POSTGRES_DB:-safecitydb}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safecity}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile

    container_name: safecity_backend
    restart: always

    ports:
      - "8000:8000"

    volumes:
      - ./apps/backend:/app
      - uploads_data:/app/uploads

    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-safecity}:${POSTGRES_PASSWORD:-safecity_pass}@db:5432/${POSTGRES_DB:-safecitydb}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-safecity}:${POSTGRES_PASSWORD:-safecity_pass}@db:5432/${POSTGRES_DB:-safecitydb}
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080

    depends_on:
      db:
        condition: service_healthy

    command: sh -c "python -m app.db.init_db && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile

    container_name: safecity_web
    restart: always

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
