<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1d7eeb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d7eeb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bef8"/>
      <stop offset="100%" stop-color="#1d7eeb"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60d5ff"/>
      <stop offset="100%" stop-color="#1d7eeb"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Glow -->
  <ellipse cx="50" cy="42" rx="38" ry="34" fill="url(#glow)"/>

  <!-- Shield outline -->
  <path d="M50 12 L78 24 L78 52 Q78 72 50 88 Q22 72 22 52 L22 24 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Shield fill -->
  <path d="M50 15 L75 26 L75 52 Q75 70 50 84 Q25 70 25 52 L25 26 Z"
        fill="#0f172a" opacity="0.7"/>

  <!-- Radar rings -->
  <circle cx="50" cy="45" r="20" fill="none" stroke="#1d7eeb" stroke-width="0.8" opacity="0.4"/>
  <circle cx="50" cy="45" r="13" fill="none" stroke="#1d7eeb" stroke-width="0.8" opacity="0.5"/>

  <!-- Location pin -->
  <path d="M50 28 C44 28 39 33 39 39 C39 46 50 58 50 58 C50 58 61 46 61 39 C61 33 56 28 50 28 Z"
        fill="url(#pinGrad)"/>
  <circle cx="50" cy="39" r="5.5" fill="#0f172a"/>

  <!-- City skyline at bottom of shield -->
  <g opacity="0.5" fill="#7eb8e8">
    <rect x="33" y="67" width="3" height="7"/>
    <rect x="37" y="64" width="3" height="10"/>
    <rect x="41" y="66" width="3" height="8"/>
    <rect x="45" y="63" width="4" height="11"/>
    <rect x="50" y="65" width="3" height="9"/>
    <rect x="54" y="68" width="3" height="6"/>
    <rect x="58" y="65" width="3" height="9"/>
    <rect x="62" y="67" width="3" height="7"/>
  </g>
</svg>
